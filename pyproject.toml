[project]
name = "analyze"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "glicko-replay",
    "ipykernel>=7.3.0",
    "jax[cuda13]>=0.11.2",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numba>=0.67",
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyfixest>=0.60.0",
    "pymc[nutpie]>=6.3.2",
    "pyreadstat>=1.3.6",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupytext>=1.19.5",
    "kaggle>=2.2.4",
    "nbconvert>=7.17.1",
    "ruff>=0.17.1",
]

[tool.uv.sources]
glicko-replay = { path = "rust/glicko_replay" }

[tool.ruff]
line-length = 250

[tool.ruff.lint]
select = ["F", "E9"]

[tool.ruff.lint.per-file-ignores]
# 函式引用的全域陣列在檔尾以 del 釋放記憶體；函式在 del 之前已呼叫完，F821 是誤報
"scripts/glicko_replay.py" = ["F821"]
