[package]
name = "likelihood"
version = "0.1.0"
edition = "2024"

[lib]
name = "likelihood_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py313"] }
numpy = "0.30"
rayon = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
